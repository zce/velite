name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build docs
        run: pnpm docs:build

      - name: Publish core package
        run: pnpm --filter velite publish --access public --provenance --no-git-checks

      - name: Publish Next.js plugin
        run: pnpm --filter @velite/plugin-next publish --access public --provenance --no-git-checks

      - name: Publish Vite plugin
        run: pnpm --filter @velite/plugin-vite publish --access public --provenance --no-git-checks
